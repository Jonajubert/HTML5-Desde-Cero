<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rutas en HTML5</title>

</head>

<body>

    <header>

        <h1>Rutas absolutas y relativas</h1>

    </header>


    <main>

        <section>

            <h2>Ruta relativa</h2>

            <!-- Entramos en la carpeta img -->
            <img
                src="img/logo.png"
                alt="Logo del sitio"
                width="150"
            >

            <!-- Entramos en la carpeta paginas -->
            <p>
                <a href="paginas/contacto.html">
                    Ir a contacto
                </a>
            </p>

        </section>


        <section>

            <h2>URL absoluta</h2>

            <p>
                <a href="https://www.example.com">
                    Visitar sitio externo
                </a>
            </p>

        </section>

    </main>


    <footer>

        <p>Creado por Jonatan Jubert</p>

    </footer>

</body>

</html>
