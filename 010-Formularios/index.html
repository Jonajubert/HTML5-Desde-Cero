<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formularios en HTML5</title>
</head>

<body>

    <main>

        <h1>Formulario de contacto</h1>

        <form action="#" method="post">

            <p>
                <label for="nombre">
                    Nombre:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                >
            </p>


            <p>
                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </p>


            <p>
                <label for="edad">
                    Edad:
                </label>

                <input
                    type="number"
                    id="edad"
                    name="edad"
                    min="1"
                >
            </p>


            <p>
                <label for="fecha">
                    Fecha:
                </label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                >
            </p>


            <p>
                <label for="mensaje">
                    Mensaje:
                </label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="5"
                ></textarea>
            </p>


            <button type="submit">
                Enviar
            </button>

        </form>

    </main>

</body>

</html>
