<!DOCTYPE html>
<!-- Indica al navegador que utilizamos HTML5 -->

<html lang="es">

<head>

    <!-- Permite mostrar correctamente caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Adapta la página a diferentes tamaños de pantalla -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Título visible en la pestaña del navegador -->
    <title>Imágenes en HTML5</title>

</head>

<body>

    <!-- Encabezado principal -->
    <header>

        <h1>Galería de imágenes</h1>

        <p>
            Aprendiendo a insertar imágenes utilizando HTML5.
        </p>

    </header>


    <!-- Contenido principal -->
    <main>

        <section>

            <h2>Una imagen de paisaje</h2>

            <!--
                src indica la ubicación del archivo.

                alt proporciona una descripción textual
                de la imagen.

                width y height indican sus dimensiones.
            -->
            <img
                src="img/montana.jpg"
                alt="Montaña junto a un lago"
                width="600"
                height="400"
            >

        </section>


        <section>

            <h2>Logo de HTML5</h2>

            <img
                src="img/html5-logo.png"
                alt="Logo de HTML5"
                width="150"
                height="150"
            >

        </section>

    </main>


    <!-- Información complementaria -->
    <aside>

        <h2>Dato importante</h2>

        <p>
            El atributo alt permite proporcionar
            una alternativa textual para la imagen.
        </p>

    </aside>


    <!-- Pie de página -->
    <footer>

        <p>Creado por Jonatan Jubert</p>

    </footer>

</body>

</html>
